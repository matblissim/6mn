<style>
/* Layout: scène plein cadre (station vue de dessus), horloge et carnet en surimpression, panneau d'actions en bas. Look noir assumé. */
:root {
  --ink: #090c0e;
  --panel: rgba(12,17,20,.92);
  --edge: #24323a;
  --teal: #6fd3c8;
  --amber: #f2b45a;
  --blood: #e0533d;
  --bone: #e8e4da;
  --muted: #8fa0a6;
  --f-title: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Inter", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--bone); font-family: var(--f-body); overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#app { position: relative; height: 100%; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

#hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
#hud > * { pointer-events: auto; }
.clock { font-family: var(--f-mono); font-size: clamp(26px, 6vw, 40px); letter-spacing: .04em; color: var(--bone); text-shadow: 0 2px 12px #000; line-height: 1; }
.clock.late { color: var(--blood); }
.loop { font-family: var(--f-title); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.goal { margin-top: 6px; max-width: min(42ch, 58vw); font-size: 13px; line-height: 1.35; color: var(--amber); text-shadow: 0 1px 6px #000; }
.goal::before { content: "Piste · "; font-family: var(--f-title); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#hideBar { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: min(560px, calc(100% - 32px)); }
#hideBar .tag { width: 100%; text-align: center; font-size: 13px; color: var(--muted); text-shadow: 0 1px 6px #000; }
#hideBar .opt { background: var(--panel); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hb { background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 11px; font-family: var(--f-title); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.hb[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }

#inv { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.chip { pointer-events: auto; background: var(--panel); border: 1px solid var(--amber); color: var(--amber); border-radius: 20px; padding: 5px 12px; font-size: 13px; }
#hint { position: absolute; pointer-events: none; background: rgba(0,0,0,.75); border: 1px solid var(--edge); color: var(--bone); font-size: 13px; padding: 3px 8px; border-radius: 3px; white-space: nowrap; transform: translate(-50%, -140%); }
#toast { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--teal); color: var(--teal); padding: 8px 14px; border-radius: 4px; font-size: 14px; text-align: center; pointer-events: none; }

#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 64%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--edge); padding-block: 14px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -20px 40px rgba(0,0,0,.6); }
#sheet h2 { font-family: var(--f-title); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; color: var(--amber); }
#sheet .say { font-size: 16px; line-height: 1.5; margin: 0 0 12px; max-width: 70ch; }
#sheet .say b { color: var(--bone); }
#sheet .say i { color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.opt { text-align: left; background: #111a1f; border: 1px solid var(--edge); border-radius: 4px; padding: 9px 12px; font-size: 15px; }
.opt:hover { border-color: var(--teal); }
.opt.give { border-color: rgba(242,180,90,.5); color: var(--amber); }
.opt.close { color: var(--muted); }

#journal { position: absolute; inset: 0; background: rgba(5,8,10,.86); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.jbox { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: #0e1519; border: 1px solid var(--edge); border-radius: 6px; padding: 20px; }
.jbox h2 { font-family: var(--f-title); font-size: 26px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; color: var(--teal); }
.jbox ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.jbox li { line-height: 1.45; }
.jbox .none { color: var(--muted); font-style: italic; }
.jbox .end { margin-top: 14px; color: var(--muted); font-size: 14px; }
.jbox h3 { font-family: var(--f-title); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); margin: 18px 0 8px; }
.jbox .tl { list-style: none; padding: 0; font-size: 14px; }
.jbox .tl li { display: flex; gap: 10px; }
.jbox .tl b { font-family: var(--f-mono); font-weight: 500; color: var(--teal); flex: none; }
.ded { border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; line-height: 1.4; }
.ded.ok { border-color: rgba(111,211,200,.5); }
.ded .opt { margin-top: 6px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ach div { border: 1px solid var(--edge); border-radius: 4px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.ach div.on { border-color: var(--amber); color: var(--bone); }
.ach div b { display: block; font-size: 13px; }
#overlay .sum { margin: 16px auto 0; max-width: 52ch; text-align: left; font-size: 14px; color: #b7c2c4; border-top: 1px solid #24323a; padding-top: 12px; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .sum b { color: var(--amber); }
#overlay .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 420px; margin: 16px auto 0; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .stats div { border: 1px solid #24323a; border-radius: 4px; padding: 8px; font-size: 13px; color: #8fa0a6; }
#overlay .stats b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 500; color: var(--bone); }
.jbox .piste { margin: 0 0 14px; padding: 10px 12px; border: 1px solid rgba(242,180,90,.4); border-radius: 4px; color: var(--amber); line-height: 1.45; }

#overlay { position: absolute; inset: 0; background: #000; display: grid; place-items: center; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#overlay .t { font-family: var(--f-title); font-size: clamp(34px, 8vw, 64px); letter-spacing: .08em; text-transform: uppercase; color: var(--bone); margin: 0 0 14px; }
#overlay .lines p { font-size: clamp(16px, 3.6vw, 20px); line-height: 1.55; color: #cfd6d6; margin: 0 0 10px; max-width: 46ch; margin-inline: auto; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .go { margin-top: 18px; background: none; border: 1px solid var(--amber); color: var(--amber); padding: 11px 22px; font-family: var(--f-title); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; border-radius: 3px; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .small { font-size: 13px; color: #6b7a80; margin-top: 18px; max-width: 52ch; margin-inline: auto; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #overlay .lines p, #overlay .go { animation: none; opacity: 1; } }
</style>

    arrestation: ["22:00:00", ["Deux agents de sécurité plaquent l'homme au gilet jaune contre la vitre.", "Par précaution, le dernier départ est annulé. Mme Delattre pleure sur le quai.", "Le gilet jaune ne dira pas un mot. Son commanditaire dormira tranquille.", "Tout recommence."], "Recommencer"],
    verite: ["La vérité", ["Odile réarme le frein de secours, puis décroche le téléphone et raconte tout.", "La vidéo de Bastien, l'enveloppe signée « V. », ses aveux : la police n'a besoin de rien d'autre.", "À 22 h 00, la dernière rame monte vers la ville haute, sous les applaudissements de Mme Delattre.", "Au matin, Vasseur sera arrêté. La boucle se brise enfin."], null]
  }[kind];
  if (kind === "chute" && S.aboard) T[1] = ["Les portes se ferment. La cabine s'élance, les lumières de la ville basse s'éloignent.", "À mi-pente, un claquement sec. La cabine s'immobilise… puis glisse en arrière.", "Mme Delattre vous agrippe le bras. Le frein de secours ne répond pas.", "Noir."];
  if (kind === "repere") { learn("dos", true); shake = 0.8; }
  if (kind === "chute") { shake = 1.2; zoomT = 1.12; paused = false; }
  setTimeout(() => { shake = 0; showOverlay(T[0], T[1], T[2], kind); }, kind === "chute" ? 1600 : 300);
}
// ce que cette boucle a appris, et un conseil pour la suivante
function loopSummary() {
  const nw = M.clues.filter(k => !S.cluesAtStart.includes(k));
  return `<div class="sum" style="animation-delay:${0.6 + 4 * 1.3}s"><b>${revealed() ? "Cette fois" : "Ce que vous avez remarqué"} :</b> ${nw.length ? nw.length + " nouvel" + (nw.length > 1 ? "s" : "") + " indice" + (nw.length > 1 ? "s" : "") + " — " + nw.filter(k => k !== "chute").slice(0, 3).map(k => CLUES[k].split(/[.:]/)[0]).join(" · ") + (nw.length > 3 ? "…" : "") : "aucun nouvel indice."}${revealed() ? `<br><b>Piste :</b> ${goal()}` : ""}</div>`;
}
function finalStats() {
  const mins = Math.round((M.playS || 0) / 60), rank = M.loops <= 3 ? "Détective légendaire" : M.loops <= 6 ? "Fin limier" : M.loops <= 10 ? "Enquêteur tenace" : "Témoin obstiné";
  return `<div class="stats" style="animation-delay:${0.6 + 4 * 1.3}s"><div><b>${M.loops}</b>boucles</div><div><b>${mins} min</b>de jeu</div><div><b>${M.endings.length}/${ENDINGS.length}</b>fins</div><div><b>${(M.ach || []).length}/${ACHS.length}</b>succès</div><div style="grid-column:1/-1"><b style="font-size:18px;font-family:var(--f-title);letter-spacing:.08em;text-transform:uppercase">${rank}</b>votre rang</div></div>`;
}
function showOverlay(title, lines, btn, kind) {
  $ov.hidden = false;

  $ov.innerHTML = `<div><p class="t">${title}</p><div class="lines">${lines.map((l, i) => `<p style="animation-delay:${0.4 + i * 1.3}s">${l}</p>`).join("")}</div>${btn ? loopSummary() : finalStats()}${btn ? `<button class="go" type="button" style="animation-delay:${0.6 + lines.length * 1.3}s">${btn}</button>` : `<button class="go" type="button" style="animation-delay:${0.6 + lines.length * 1.3}s">Rejouer depuis le début</button><p class="small">Fins découvertes : ${M.endings.length}/${ENDINGS.length}. Fiction : le POMA 2000 a réellement relié la gare à la ville haute de Laon de 1989 à 2016 ; personnages et événements sont inventés.</p>`}</div>`;
    $ov.querySelector(".go").addEventListener("click", () => {
    Voice.stop();
    if (btn && !revealed()) { M.loops++; saveM(); Snd.rewind(); newLoop(); award("premiere"); revealOverlay(); }
    else if (btn) { M.loops++; saveM(); Snd.rewind(); $ov.hidden = true; newLoop(); rewindT = 1.6; zoom = 1.25; zoomT = 1; paused = false; toast("21 h 54. Encore. Le carnet garde ce que vous avez appris."); }
    else { M.clues = []; M.ded = []; M.loops = 1; M.playS = 0; saveM(); $ov.hidden = true; newLoop(); paused = false; }
  });
}

// la révélation : on se réveille à 21:54, et tout est exactement pareil
function revealOverlay() {
  paused = true; $ov.hidden = false;
  $ov.innerHTML = `<div><p class="t">21:54:00</p><div class="lines"><p style="animation-delay:.4s">Le néon grésille. La pluie tombe sur le parvis.</p><p style="animation-delay:1.9s">Derrière sa vitre, Odile ajuste ses lunettes. Exactement comme tout à l'heure.</p><p style="animation-delay:3.4s">Mme Delattre serre son sac contre elle. Le même geste. Le même soupir.</p><p style="animation-delay:5s">Vous avez déjà vécu ces six minutes.</p></div><button class="go" type="button" style="animation-delay:6.4s">…Encore ?</button><p class="small" style="opacity:0;animation:up 1s ease-out 6.8s forwards">Ce que vous avez vu reste dans votre carnet. Le reste du monde, lui, a tout oublié.</p></div>`;
  $ov.querySelector(".go").addEventListener("click", () => { $ov.hidden = true; paused = false; rewindT = 1.6; zoom = 1.25; zoomT = 1; updateLoopLbl(); updateGoal(); toast("Boucle 2. Le carnet garde ce que vous avez appris."); });
}

/* ================= Carnet ================= */
function openJournal() {
  paused = true; $jr.hidden = false;
  const dedHtml = DEDS.map(d => { const got = d.needs.filter(knows).length; if (knowsDed(d.k)) return `<div class="ded ok"><b>✓ ${d.t}</b><br>${d.txt}</div>`;
    if (got === d.needs.length) return `<div class="ded"><b>${d.t} ?</b><br>Vous avez les deux indices. <button class="opt give" type="button" data-ded="${d.k}">Relier les indices</button></div>`;
    return `<div class="ded"><b>???</b> <span style="color:var(--muted)">${got}/${d.needs.length} indice${got > 1 ? "s" : ""}</span></div>`; }).join("");
  const tl = S.log.length ? `<ol class="tl">${S.log.map(e => `<li><b>${fmtT(e.t)}</b><span>${e.txt}</span></li>`).join("")}</ol>` : `<p class="none">Rien de remarquable pour l'instant.</p>`;
  $jbox.innerHTML = `<h2>Carnet</h2><p class="piste"><b>Piste :</b> ${goal()}</p>
    <h3>Déductions</h3>${dedHtml}
    <h3>${revealed() ? "Cette boucle" : "Ce soir"}</h3>${tl}
    <h3>Indices (${M.clues.length})</h3>${M.clues.length ? `<ol>${M.clues.map(k => `<li>${CLUES[k]}</li>`).join("")}</ol>` : `<p class="none">Rien encore. Observez, écoutez, fouillez. Le temps est compté.</p>`}
    ${revealed() ? `<h3>Succès (${(M.ach || []).length}/${ACHS.length})</h3><div class="ach">${ACHS.map(a => `<div class="${(M.ach || []).includes(a.k) ? "on" : ""}"><b>${(M.ach || []).includes(a.k) ? "🏆 " : ""}${a.t}</b>${a.d}</div>`).join("")}</div>
    <p class="end">Boucle ${M.loops} · fins découvertes : ${M.endings.length}/${ENDINGS.length}</p>` : ""}<div class="opts" style="margin-top:14px"><button class="opt close" type="button" id="jClose">Fermer le carnet</button></div>`;
  for (const b of $jbox.querySelectorAll("[data-ded]")) b.addEventListener("click", () => { M.ded = M.ded || []; M.ded.push(b.dataset.ded); saveM(); Snd.note(); if (DEDS.every(d => M.ded.includes(d.k))) award("logicien"); openJournal(); });
  document.getElementById("jClose").addEventListener("click", () => { $jr.hidden = true; paused = !$sheet.hidden; });
}
document.getElementById("bJournal").addEventListener("click", openJournal);
// attendre jusqu'à un moment clé, ou rembobiner tout de suite
const MOMENTS = [[60, "21:55:00 · le coup de fil du gilet jaune"], [90, "21:55:30 · le téléphone du guichet"], [120, "21:56:00 · Bastien pose son sac"], [200, "21:57:20 · Odile part au café"], [280, "21:58:40 · Odile revient"], [300, "21:59:00 · la rame arrive"]];
document.getElementById("bWait").addEventListener("click", () => {
  if (S.over || S.hidden || !$sheet.hidden) return;
  const o = MOMENTS.filter(([t]) => t > S.t + 3).map(([t, l]) => ({ l: `Attendre jusqu'à ${l}`, fx: () => { S.skipTo = t; S.follow = null; closeSheet(); } }));
  if (revealed()) o.push({ l: "⟲ Rembobiner maintenant (on garde le carnet)", fx: () => { closeSheet(); rewindNow(); } });
  sheet("Attendre", "Le temps file à toute vitesse jusqu'au moment choisi. Les autres vivent leur soirée sans vous attendre.", o);
});
function rewindNow() { const learned = M.clues.filter(k => !S.cluesAtStart.includes(k)).length; M.loops++; saveM(); Snd.rewind(); newLoop(); rewindT = 1.6; zoom = 1.25; zoomT = 1; paused = false; toast(`21 h 54. Encore. ${learned ? learned + " indice" + (learned > 1 ? "s" : "") + " de plus dans le carnet." : "Rien de neuf cette fois."}`); }
const $fast = document.getElementById("bFast"); $fast.addEventListener("click", () => { fast = !fast; $fast.setAttribute("aria-pressed", fast); });
const $voice = document.getElementById("bVoice"); $voice.setAttribute("aria-pressed", M.voice !== false);
$voice.addEventListener("click", () => { M.voice = M.voice === false; saveM(); $voice.setAttribute("aria-pressed", M.voice !== false); if (M.voice === false) Voice.stop(); });
const $snd = document.getElementById("bSound"); $snd.setAttribute("aria-pressed", M.sound); $snd.addEventListener("click", () => { Snd.init(); Snd.set(!M.sound); $snd.setAttribute("aria-pressed", M.sound); });

/* ================= Boucle principale ================= */
let last = performance.now(), lastSec = -1;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused && !S.over) {
    const dt = real * (S.skipTo ? 14 : fast ? 6 : 1);
    if (S.skipTo && S.t >= S.skipTo) S.skipTo = 0;
    M.playS = (M.playS || 0) + real; if (Math.floor(M.playS) % 10 === 0 && Math.floor(M.playS - real) % 10 !== 0) saveM();

}

resize(); newLoop();
if (location.hash === "#debug") window.__dbg = { get S() { return S; }, A, M, P, award, openJournal, rewindNow, DEDS, talk, examine, goTo, learn, give, has, endLoop, walkable, clampWalk, route, HOT, NODES };
