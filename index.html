#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 64%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--edge); padding-block: 14px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -20px 40px rgba(0,0,0,.6); }
#sheet h2 { font-family: var(--f-title); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; color: var(--amber); }

@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #overlay .lines p, #overlay .go { animation: none; opacity: 1; } }

<script>
(() => {
"use strict";
/* ================= Données ================= */
const IW = 1920, IH = 1084, LOOP = 360;
const KEY = "derniere-rame-v1";
const M = (() => { try { return Object.assign({ clues: [], loops: 1, endings: [], seenIntro: false, sound: true }, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return { clues: [], loops: 1, endings: [], seenIntro: false, sound: true }; } })();
const saveM = () => { try { localStorage.setItem(KEY, JSON.stringify(M)); } catch (e) {} };

const CLUES = {
  chute: "À 22 h 00, la dernière rame s'immobilise dans la pente… puis tout recommence à 21 h 54.",
  cafe: "Odile quitte son poste à 21 h 57 pour aller chercher un café au distributeur.",
  piece: "Il y a une pièce de deux euros sous le banc.",
  local: "Dès qu'Odile s'absente, l'homme au gilet jaune se glisse dans le local technique et fouille l'armoire.",
  frein: "Le frein de secours a été désarmé dans l'armoire du local technique.",
  intrus: "Mme Delattre connaît tout le personnel : l'homme au gilet jaune n'en fait pas partie.",
  drone: "Bastien cache un drone et une caméra dans son sac. Il veut filmer le dernier voyage, en douce.",
  sursis: "Empêcher le sabotage ne suffit pas : le gilet jaune repart libre, et la boucle continue.",
  preuve: "Odile ne bloquera pas le dernier départ sans preuve.",
  appel: "À 21 h 55, à l'entrée, le gilet jaune téléphone à un certain « monsieur Vasseur » : « Personne ne verra rien. »",
  vasseur: "Vasseur est le promoteur qui veut raser la station pour construire des immeubles, selon Mme Delattre.",
  enveloppe: "Pendant le sabotage, le gilet jaune laisse sa sacoche devant le local : dedans, 5 000 € et un mot signé « V. ».",
  sms: "Sur le téléphone d'Odile, un SMS : « 21h57. Deux minutes. Pas une de plus. — V. » Sa pause café n'est pas un hasard.",
  aveux: "Odile a avoué : on lui a promis qu'il ne s'agissait que d'immobiliser la rame en gare, pas de la faire tomber.",
  mefiance: "Si on parle du local au gilet jaune avant 21 h 57, il se méfie, renonce… et s'en va libre.",
  incomplet: "Sauver la rame ne suffit pas : tant que la vérité entière n'est pas faite, la boucle recommence."
};
function learn(k, silent) { if (M.clues.includes(k)) return; M.clues.push(k); saveM(); if (!silent) toast("Nouvel indice noté dans le carnet"); Snd.note(); }
const knows = k => M.clues.includes(k);

/* Plan de la station (coordonnées normalisées sur l'illustration) */
const WALK = [
  { x0: 0.2, y0: 0.42, x1: 0.6, y1: 0.93, room: "hall" },
  { x0: 0.42, y0: 0.21, x1: 0.6, y1: 0.44, room: "hall" },
  { x0: 0.12, y0: 0.58, x1: 0.22, y1: 0.9, room: "hall" },
  { x0: 0.628, y0: 0.26, x1: 0.77, y1: 0.53, room: "hall", plat: true }, // quai, à droite du pilier
  { x0: 0.6, y0: 0.52, x1: 0.7, y1: 0.7, room: "hall", plat: true },
  { x0: 0.25, y0: 0.2, x1: 0.4, y1: 0.33, room: "ctrl" }
];
const DOOR_IN = { x: 0.365, y: 0.3 }, DOOR_OUT = { x: 0.37, y: 0.44 };
const P = {
  start: { x: 0.16, y: 0.8 }, outside: { x: 0.05, y: 0.84 },
  desk: { x: 0.3, y: 0.25 }, cabinet: { x: 0.35, y: 0.22 }, window: { x: 0.33, y: 0.44 },
  vending: { x: 0.47, y: 0.92 }, bench: { x: 0.28, y: 0.46 }, ticket: { x: 0.22, y: 0.6 },
  gerWait: { x: 0.68, y: 0.32 }, gerDoor: { x: 0.46, y: 0.44 }, gerEnd: { x: 0.6, y: 0.68 },
  bastPlat: { x: 0.635, y: 0.57 }, film: { x: 0.45, y: 0.5 }, board: { x: 0.66, y: 0.47 }, delWait: { x: 0.23, y: 0.62 }
};
const HOT = [
  { id: "door", name: "Porte du local technique", x: 0.37, y: 0.39, r: 0.04, at: DOOR_OUT },
  { id: "cabinet", name: "Armoire électrique", x: 0.35, y: 0.14, r: 0.045, at: P.cabinet },
  { id: "bench", name: "Banc", x: 0.23, y: 0.4, r: 0.045, at: P.bench },
  { id: "ticket", name: "Distributeur de billets", x: 0.17, y: 0.52, r: 0.04, at: P.ticket },
  { id: "vending", name: "Distributeur de boissons", x: 0.47, y: 0.74, r: 0.055, at: P.vending },
  { id: "alarm", name: "Arrêt d'urgence", x: 0.62, y: 0.39, r: 0.03, at: { x: 0.645, y: 0.42 } },
  { id: "board", name: "Tableau des départs", x: 0.66, y: 0.24, r: 0.035, at: { x: 0.65, y: 0.3 } },
  { id: "poster", name: "Affiche", x: 0.19, y: 0.31, r: 0.03, at: { x: 0.23, y: 0.46 } },
  { id: "exit", name: "Sortie", x: 0.1, y: 0.72, r: 0.05, at: { x: 0.15, y: 0.77 } },
  { id: "rame", name: "La rame", x: 0.76, y: 0.48, r: 0.07, at: P.board },
  { id: "bag", name: "Sac de sport", x: 0.25, y: 0.43, r: 0.03, at: P.bench },
  { id: "toolbag", name: "Sacoche à outils", x: 0.41, y: 0.43, r: 0.025, at: { x: 0.43, y: 0.47 } },
  { id: "desk", name: "Bureau d'Odile", x: 0.27, y: 0.17, r: 0.035, at: { x: 0.29, y: 0.25 } }
];

/* ================= Sons ================= */
const Snd = {
  ctx: null, master: null, hum: null,
  init() {
    if (this.ctx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC(); this.master = c.createGain(); this.master.gain.value = M.sound ? 0.5 : 0; this.master.connect(c.destination);
    const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = 50; const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 140; const g = c.createGain(); g.gain.value = 0.05; o.connect(f); f.connect(g); g.connect(this.master); o.start();
    const n = c.createBufferSource(), b = c.createBuffer(1, c.sampleRate * 3, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5; n.buffer = b; n.loop = true;
    const nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 900; nf.Q.value = 0.4; const ng = c.createGain(); ng.gain.value = 0.012; n.connect(nf); nf.connect(ng); ng.connect(this.master); n.start();
  },
  set(on) { M.sound = on; saveM(); if (this.master) this.master.gain.setTargetAtTime(on ? 0.5 : 0, this.ctx.currentTime, 0.05); },
  tone(fr, dur, { type = "sine", vol = 0.1, to = null, delay = 0 } = {}) { if (!this.ctx || !M.sound) return; const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(fr, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05); },
  noise(dur, freq, vol, delay = 0) { if (!this.ctx || !M.sound) return; const c = this.ctx, t = c.currentTime + delay, n = c.createBufferSource(), b = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); n.buffer = b; const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq; const g = c.createGain(); g.gain.value = vol; n.connect(f); f.connect(g); g.connect(this.master); n.start(t); },
  tick() { this.tone(1600, 0.03, { type: "square", vol: 0.03 }); },
  note() { this.tone(880, 0.25, { type: "triangle", vol: 0.05 }); this.tone(1320, 0.3, { type: "triangle", vol: 0.04, delay: 0.08 }); },
  step() { this.noise(0.05, 900, 0.05); },
  chime() { [659, 523, 392].forEach((f, i) => this.tone(f, 0.6, { vol: 0.07, delay: i * 0.35 })); },
  rame() { this.tone(70, 4, { type: "sawtooth", to: 110, vol: 0.05 }); this.noise(4, 400, 0.08); },
  crash() { this.noise(2.5, 300, 0.5); this.tone(120, 2.5, { type: "sawtooth", to: 30, vol: 0.12 }); this.tone(900, 1.2, { type: "square", to: 200, vol: 0.05, delay: 0.3 }); },
  alarm() { for (let i = 0; i < 6; i++) this.tone(i % 2 ? 660 : 880, 0.3, { type: "square", vol: 0.05, delay: i * 0.32 }); },
  rewind() { this.tone(1800, 1.4, { type: "sawtooth", to: 120, vol: 0.05 }); this.noise(1.4, 3000, 0.08); },
  zap() { this.noise(0.08, 4000, 0.05); }
};
addEventListener("pointerdown", () => Snd.init(), { capture: true });

/* ================= Voix (synthèse vocale du navigateur, gratuite) ================= */
const Voice = {
  voices: [], audio: null,
  rec: [["Bonsoir. Dernière rame", "voix/odile_bonsoir.mp3"], ["Sous-traitance.", "voix/gerald_soustraitance.mp3"], ["Mm. J'attends la dernière", "voix/bastien_bonsoir.mp3"]],
  prof: { odile: { p: 0.95, r: 1.22, i: 0 }, gerald: { p: 0.6, r: 1.15, i: 1 }, bastien: { p: 1.15, r: 1.35, i: 2 }, delattre: { p: 1.3, r: 1.12, i: 0 } },
  ok: "speechSynthesis" in window,
  init() { if (!this.ok) return; const load = () => { this.voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); }; load(); speechSynthesis.onvoiceschanged = load; },
  speak(who, html) {
    if (M.voice === false) return;
    const txt = html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(), quotes = [...txt.matchAll(/«\s*([^»]+?)\s*»/g)].map(m => m[1]);
    // seuls les personnages parlent : jamais de narrateur, jamais les descriptions hors guillemets
    const pr = this.prof[who]; if (!pr || !quotes.length) return;
    const line = quotes.join(". ").replace(/…/g, ",");
    // répliques doublées par des acteurs (ElevenLabs) : priorité sur la synthèse du navigateur
    const rec = this.rec.find(r => quotes[0].startsWith(r[0]));
    if (rec) { this.stop(); try { this.audio = new Audio(rec[1]); this.audio.volume = 0.95; this.audio.play().catch(() => {}); } catch (e) {} return; }
    if (!this.ok) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(line); u.lang = "fr-FR"; if (this.voices.length) u.voice = this.voices[pr.i % this.voices.length]; u.pitch = pr.p; u.rate = pr.r; u.volume = 0.95; speechSynthesis.speak(u); } catch (e) {}
  },
  stop() { if (this.audio) { this.audio.pause(); this.audio = null; } if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} }
};
Voice.init();
const WHO = { "Odile": "odile", "L'homme au gilet jaune": "gerald", "Bastien": "bastien", "Mme Delattre": "delattre" };

/* ================= Images ================= */
const IMG = {};
[["bg", "img/station.jpg"], ["joueur", "img/joueur.webp"], ["odile", "img/odile.webp"], ["bastien", "img/bastien.webp"], ["delattre", "img/delattre.webp"], ["gerald", "img/gerald.webp"], ["rame", "img/rame.webp"]].forEach(([k, s]) => { const im = new Image(); im.onload = () => { IMG[k] = im; }; im.src = s; });
for (const n of ["joueur", "odile", "bastien", "delattre", "gerald"]) for (const v of ["f", "b", "s", "w"]) { const im = new Image(); im.onload = () => { IMG[`${n}_${v}`] = im; }; im.src = `img/${n}_${v}.webp`; }
// vue à afficher : de dos quand il s'éloigne, de profil quand il traverse (deux images alternées), de face sinon
function viewImg(a) {
  const n = a.img, f = a.face || "f";
  if (f === "s") { const step = a.path.length && Math.sin((a.walk || 0) * 11) > 0; return IMG[`${n}_${step ? "w" : "s"}`] || IMG[`${n}_s`] || IMG[n]; }
  return IMG[`${n}_${f}`] || IMG[n];
}

/* ================= État d'une boucle ================= */
let S;
function newLoop() {
  S = { t: 0, items: [], coinTaken: false, odileStays: false, sab: 0, sabDone: false, fixed: false, fixT: 0, gerInterrupted: false, gerFled: false, gerCaught: false,
    bastTrust: false, bastFilm: false, filmed: 0, photo: null, photoGiven: false, alarm: false, odileKnows: false, over: false, sawLocal: false, said: {},
    gerWary: false, toolbagDown: false, envTaken: false, smsSeen: false, odileConfess: false, envShown: false };
  A.player = { x: P.start.x, y: P.start.y, path: [], vis: true, name: "Toi", img: "joueur", dir: 1 };
  A.odile = { x: P.desk.x, y: P.desk.y, path: [], vis: true, name: "Odile", img: "odile", dir: 1, goal: null };
  A.gerald = { x: P.outside.x, y: P.outside.y, path: [], vis: false, name: "L'homme au gilet jaune", img: "gerald", dir: 1, goal: null };
  A.bastien = { x: P.bench.x, y: P.bench.y - 0.02, path: [], vis: true, name: "Bastien", img: "bastien", dir: 1, goal: null };
  A.delattre = { x: P.delWait.x, y: P.delWait.y, path: [], vis: true, name: "Mme Delattre", img: "delattre", dir: 1, goal: null };
  rame.y = -0.3; rame.state = "away";
  renderInv(); updateLoopLbl();
}
const A = {};
const rame = { y: -0.3, state: "away" };

/* ================= Déplacements ================= */
const CTRL = WALK.find(r => r.room === "ctrl");
const roomOf = p => (CTRL.x0 <= p.x && p.x <= CTRL.x1 && CTRL.y0 <= p.y && p.y <= CTRL.y1 ? "ctrl" : "hall");
// bord jaune du quai mesuré sur l'illustration (diagonale) ; on garde une marge pour rester sur le carrelage clair
const platEdge = y => 0.787 - (y - 0.25) * 0.31, platMax = y => platEdge(y) - 0.045;
const onUpperPlat = p => p.x > 0.615 && p.y < 0.53;
function clampWalk(p) {
  let best = null, bd = 9;
  for (const r of WALK) {
    const y = Math.max(r.y0, Math.min(r.y1, p.y)), x1 = r.plat ? Math.min(r.x1, platMax(y)) : r.x1;
    const x = Math.max(r.x0, Math.min(x1, p.x)), d = Math.hypot(x - p.x, (y - p.y) * 0.56);
    if (d < bd) { bd = d; best = { x, y }; }
  }
  return best;

    sursis: ["22:00:00", ["La rame s'élance et disparaît vers la ville haute. Rien ne se passe.", "Sur le parvis, l'homme au gilet jaune allume une cigarette et s'éloigne sans se retourner.", "Il recommencera. Vous le savez.", "Le monde se replie sur lui-même."], "Recommencer"],
    alarm: ["22:00:00", ["Les sirènes hurlent. Le dernier départ est annulé.", "Dans la confusion, l'homme au gilet jaune s'est volatilisé.", "Rien n'est réglé. Rien ne l'est jamais.", "Tout recommence."], "Recommencer"],
    win: ["Le dernier voyage", ["Odile réarme le frein de secours d'une main tremblante.", "Deux agents de sécurité retiennent l'homme au gilet jaune à la sortie.", "À 22 h 00, la dernière rame monte vers la ville haute, sous les applaudissements de Mme Delattre.", "Mais le gilet jaune ne dira rien. Quelqu'un l'a payé. Et la nuit se replie sur elle-même."], "Chercher la vérité"],
    aveux: ["22:00:00", ["Odile n'a pas quitté son poste. Le gilet jaune a attendu, puis il est parti.", "La rame monte sans encombre. Odile pleure en silence derrière sa vitre.", "Sans preuve du sabotage, Vasseur ne sera jamais inquiété.", "Tout recommence."], "Recommencer"],
    verite: ["La vérité", ["Odile réarme le frein de secours, puis décroche le téléphone et raconte tout.", "La vidéo de Bastien, l'enveloppe signée « V. », ses aveux : la police n'a besoin de rien d'autre.", "À 22 h 00, la dernière rame monte vers la ville haute, sous les applaudissements de Mme Delattre.", "Au matin, Vasseur sera arrêté. La boucle se brise enfin."], null]
  }[kind];
  if (kind === "chute") { shake = 1.2; zoomT = 1.12; paused = false; }
  setTimeout(() => { shake = 0; showOverlay(T[0], T[1], T[2], kind); }, kind === "chute" ? 1600 : 300);
}
function showOverlay(title, lines, btn, kind) {
  $ov.hidden = false;
  $ov.innerHTML = `<div><p class="t">${title}</p><div class="lines">${lines.map((l, i) => `<p style="animation-delay:${0.4 + i * 1.3}s">${l}</p>`).join("")}</div>${btn ? `<button class="go" type="button" style="animation-delay:${0.6 + lines.length * 1.3}s">${btn}</button>` : `<button class="go" type="button" style="animation-delay:${0.6 + lines.length * 1.3}s">Rejouer depuis le début</button><p class="small">Fins découvertes : ${M.endings.length}/6. Fiction : le POMA 2000 a réellement relié la gare à la ville haute de Laon de 1989 à 2016 ; personnages et événements sont inventés.</p>`}</div>`;
    $ov.querySelector(".go").addEventListener("click", () => {
    Voice.stop();
    if (btn) { M.loops++; saveM(); Snd.rewind(); $ov.hidden = true; newLoop(); rewindT = 1.6; zoom = 1.25; zoomT = 1; paused = false; toast("21 h 54. Encore. Le carnet garde ce que vous avez appris."); }
    else { M.clues = []; M.loops = 1; saveM(); $ov.hidden = true; newLoop(); paused = false; }
  });
}

/* ================= Carnet ================= */
function openJournal() {
  paused = true; $jr.hidden = false;
  $jbox.innerHTML = `<h2>Carnet</h2>${M.clues.length ? `<ol>${M.clues.map(k => `<li>${CLUES[k]}</li>`).join("")}</ol>` : `<p class="none">Rien encore. Observez, écoutez, fouillez. Le temps est compté.</p>`}<p class="end">Boucle ${M.loops} · fins découvertes : ${M.endings.length}/6</p><div class="opts" style="margin-top:14px"><button class="opt close" type="button" id="jClose">Fermer le carnet</button></div>`;
  document.getElementById("jClose").addEventListener("click", () => { $jr.hidden = true; paused = !$sheet.hidden; });
}
document.getElementById("bJournal").addEventListener("click", openJournal);
const $fast = document.getElementById("bFast"); $fast.addEventListener("click", () => { fast = !fast; $fast.setAttribute("aria-pressed", fast); });
const $voice = document.getElementById("bVoice"); $voice.setAttribute("aria-pressed", M.voice !== false);
$voice.addEventListener("click", () => { M.voice = M.voice === false; saveM(); $voice.setAttribute("aria-pressed", M.voice !== false); if (M.voice === false) Voice.stop(); });
const $snd = document.getElementById("bSound"); $snd.setAttribute("aria-pressed", M.sound); $snd.addEventListener("click", () => { Snd.init(); Snd.set(!M.sound); $snd.setAttribute("aria-pressed", M.sound); });

/* ================= Boucle principale ================= */
let last = performance.now(), lastSec = -1;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused && !S.over) {
    const dt = real * (fast ? 6 : 1);
    S.t += dt;
    if (stepAgent(A.player, dt, 0.11) && pending) arrive();
    if (A.player.path.length) { A.player.stepAcc = (A.player.stepAcc || 0) + real; if (A.player.stepAcc > 0.3) { A.player.stepAcc = 0; Snd.step(); if (A.player.y > 0.6) ripples.push({ x: A.player.x, y: A.player.y, k: 0.55 }); } }
    if (!focus) zoomT = S.t > 340 ? 1.1 : 1;
    updateAgents(dt);
    if (Math.floor(S.t) !== lastSec) { lastSec = Math.floor(S.t); if (S.t > 350) Snd.tick(); }
    if (S.fixed && !S.gerCaught && A.gerald.vis) { S.gerCaught = true; say(A.gerald, "Lâchez-moi !"); }
    if (S.t >= LOOP) { S.t = LOOP; endLoop(); }
  }
  for (const b of bubbles) b.life -= real; while (bubbles.length && bubbles[0].life <= 0) bubbles.shift();
  if (toastT > 0) { toastT -= real; if (toastT <= 0) $toast.hidden = true; }
  $clock.textContent = fmtT(S.t); $clock.classList.toggle("late", S.t > 345);
  if (rewindT > 0) rewindT = Math.max(0, rewindT - real);
  render(now, real); requestAnimationFrame(frame);
}

resize(); newLoop();
if (location.hash === "#debug") window.__dbg = { get S() { return S; }, A, M, P, talk, examine, goTo, learn };
if (!M.seenIntro) {
  paused = true; $ov.hidden = false;
  $ov.innerHTML = `<div><p class="t">La Dernière Rame</p><div class="lines"><p style="animation-delay:.3s">Laon, samedi 27 août 2016. Station basse du POMA.</p><p style="animation-delay:1.5s">À 22 h 00, la toute dernière rame doit monter vers la ville haute. Puis la ligne fermera pour toujours.</p><p style="animation-delay:2.9s">Vous avez six minutes. Et vous allez les revivre. Encore. Et encore.</p></div><button class="go" type="button" style="animation-delay:4.2s">Entrer dans la station</button><p class="small">Touchez le sol pour marcher, un objet ou une personne pour interagir. « Avancer » accélère le temps. Fiction inspirée d'un lieu réel.</p></div>`;
  $ov.querySelector(".go").addEventListener("click", () => { M.seenIntro = true; saveM(); $ov.hidden = true; paused = false; Snd.init(); Snd.chime(); });
}
requestAnimationFrame(frame);
})();
</script>
