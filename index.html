<style>

[hidden] { display: none !important; }

#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 64%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--edge); padding-block: 14px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -20px 40px rgba(0,0,0,.6); }

.ch { opacity: 0; } .ch.on { opacity: 1; }

#tut { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); max-width: min(420px, calc(100% - 32px)); background: rgba(8,12,14,.9); border: 1px solid var(--amber); color: var(--bone); padding: 9px 14px; border-radius: 20px; font-size: 14px; text-align: center; pointer-events: none; animation: fadeIn .4s ease-out; }
.chip { cursor: pointer; font-family: inherit; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 14px; }
.tabs button { background: none; border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; font-family: var(--f-title); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-selected="true"] { border-color: var(--teal); color: var(--teal); }
.who { border: 1px solid var(--edge); border-radius: 4px; padding: 10px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
.who img { width: 56px; flex: none; }
.who b { display: block; font-family: var(--f-title); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.menu .opt { display: flex; justify-content: space-between; gap: 12px; }
.menu .opt span { color: var(--amber); }
.credits { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 14px; }

#app.big #sheet .say { font-size: 19px; } #app.big .opt { font-size: 17px; } #app.big .jbox li, #app.big .who, #app.big .ded { font-size: 16px; } #app.big .goal { font-size: 15px; } #app.big .chip { font-size: 15px; }
#sheet { max-height: 56%; background: linear-gradient(rgba(10,15,18,.9), rgba(8,11,13,.97)); border-top: 1px solid rgba(111,211,200,.35); backdrop-filter: blur(8px); }
.opt { border-radius: 10px; transition: border-color .15s, transform .1s; } .opt:active { transform: scale(.985); }
.chip { background: rgba(10,14,16,.78); border-color: rgba(242,180,90,.55); backdrop-filter: blur(6px); }
#sheet.talk { display: flex; gap: 14px; align-items: flex-end; }
#sheet .por { flex: none; width: clamp(92px, 24vw, 190px); align-self: flex-end; margin-bottom: -18px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
#sheet .body { flex: 1; min-width: 0; }
.opts { display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.opt { text-align: left; background: #111a1f; border: 1px solid var(--edge); border-radius: 4px; padding: 9px 12px; font-size: 15px; }
.opt:hover { border-color: var(--teal); }
.opt.give { border-color: rgba(242,180,90,.5); color: var(--amber); }

#journal { position: absolute; inset: 0; background: rgba(5,8,10,.86); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.jbox { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: #0e1519; border: 1px solid var(--edge); border-radius: 6px; padding: 20px; }
.jbox h2 { font-family: var(--f-title); font-size: 26px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; color: var(--teal); }
.jbox ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.jbox li { line-height: 1.45; }
.jbox .none { color: var(--muted); font-style: italic; }
.jbox .end { margin-top: 14px; color: var(--muted); font-size: 14px; }
.jbox h3 { font-family: var(--f-title); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); margin: 18px 0 8px; }
.jbox .tl { list-style: none; padding: 0; font-size: 14px; }
.jbox .tl li { display: flex; gap: 10px; }
.jbox .tl b { font-family: var(--f-mono); font-weight: 500; color: var(--teal); flex: none; }
.ded { border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; line-height: 1.4; }
.ded.ok { border-color: rgba(111,211,200,.5); }
.ded .opt { margin-top: 6px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ach div { border: 1px solid var(--edge); border-radius: 4px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.ach div.on { border-color: var(--amber); color: var(--bone); }
.ach div b { display: block; font-size: 13px; }
#overlay.scene { background: #000 center / cover no-repeat; }
#overlay.scene > div { background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.82)); padding: 24px 18px; border-radius: 8px; max-width: 640px; }
#overlay .two { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#overlay .chp { width: 120px; margin: 4px auto 0; display: block; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .big { font-size: clamp(40px, 11vw, 86px); letter-spacing: .1em; text-shadow: 0 4px 30px #000; margin-bottom: 4px; }
#overlay .sub { font-family: var(--f-title); letter-spacing: .3em; text-transform: uppercase; color: var(--teal); font-size: 15px; margin: 0 0 22px; }
#overlay.title { background: #000 center / cover no-repeat; place-items: end center; }
#overlay.title > div { padding-bottom: clamp(30px, 9vh, 90px); width: 100%; background: linear-gradient(transparent, rgba(0,0,0,.85) 55%); padding-top: 80px; }
#overlay .sum { margin: 16px auto 0; max-width: 52ch; text-align: left; font-size: 14px; color: #b7c2c4; border-top: 1px solid #24323a; padding-top: 12px; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .sum b { color: var(--amber); }
#overlay .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 420px; margin: 16px auto 0; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .stats div { border: 1px solid #24323a; border-radius: 4px; padding: 8px; font-size: 13px; color: #8fa0a6; }
#overlay .stats b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 500; color: var(--bone); }
.jbox .piste { margin: 0 0 14px; padding: 10px 12px; border: 1px solid rgba(242,180,90,.4); border-radius: 4px; color: var(--amber); line-height: 1.45; }

#overlay { position: absolute; inset: 0; background: #000; display: grid; place-items: center; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#overlay .t { font-family: var(--f-title); font-size: clamp(34px, 8vw, 64px); letter-spacing: .08em; text-transform: uppercase; color: var(--bone); margin: 0 0 14px; }
#overlay .lines p { font-size: clamp(16px, 3.6vw, 20px); line-height: 1.55; color: #cfd6d6; margin: 0 0 10px; max-width: 46ch; margin-inline: auto; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .go { margin-top: 18px; background: none; border: 1px solid var(--amber); color: var(--amber); padding: 11px 22px; font-family: var(--f-title); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; border-radius: 3px; opacity: 0; animation: up 1s ease-out forwards; }
#overlay .small { font-size: 13px; color: #6b7a80; margin-top: 18px; max-width: 52ch; margin-inline: auto; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #overlay .lines p, #overlay .go { animation: none; opacity: 1; } }
</style>

<div id="app">
  <canvas id="cv" aria-label="La station basse du POMA, vue de dessus. Touchez un lieu ou un personnage."></canvas>

<script>
(() => {
"use strict";
/* ================= Données ================= */
const IW = 1920, IH = 1084, LOOP = 360;
const KEY = "derniere-rame-v1";
const M = (() => { try { return Object.assign({ clues: [], loops: 1, endings: [], seenIntro: false, sound: true, ded: [], ach: [], playS: 0 }, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return { clues: [], loops: 1, endings: [], seenIntro: false, sound: true, ded: [], ach: [], playS: 0 }; } })();
const saveM = () => { try { localStorage.setItem(KEY, JSON.stringify(M)); } catch (e) {} };

const CLUES = {
  chute: "À 22 h 00, la dernière rame s'immobilise dans la pente… puis tout recommence à 21 h 54.",
  cafe: "Votre mère quitte son poste à 21 h 57 pour aller chercher un café au distributeur.",
  piece: "Il y a une pièce de deux euros sous le banc.",

  sursis: "Empêcher le sabotage ne suffit pas : le gilet jaune repart libre, et la boucle continue.",
  preuve: "Votre mère ne bloquera pas le dernier départ sans preuve.",

const ENDINGS = ["chute", "sursis", "alarm", "aveux", "win", "arrestation", "repere", "verite", "silence", "erreur", "ombre", "manuel", "achete"];
// piste du moment : ce que le joueur devrait chercher, selon ce qu'il sait déjà
// coup de pouce : la même étape que la piste, mais dite clairement
function hint() {
