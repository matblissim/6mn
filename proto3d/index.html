      setTimeout(() => { setPose(gerald, null); if (talkTo !== gerald) gerald.hold = false; }, 4200); }

  const a = rainG.attributes.position; for (let i = 0; i < rainN; i++) { a.array[i * 3 + 1] -= dt * 9; if (a.array[i * 3 + 1] < 0) a.array[i * 3 + 1] = 7; } a.needsUpdate = true;
